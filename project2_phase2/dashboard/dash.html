<!DOCTYPE html>

<html>
<head>
    <title>Retail Sales Dashboard</title>

```
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 40px;
        background: #f5f5f5;
    }

    h1 {
        text-align: center;
    }

    .cards {
        display: flex;
        gap: 20px;
        justify-content: center;
        margin: 30px 0;
    }

    .card {
        background: white;
        padding: 20px;
        border-radius: 10px;
        width: 200px;
        text-align: center;
    }

    .charts {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 30px;
    }

    img {
        width: 800px;
        max-width: 90%;
    }
</style>
```

</head>

<body>

```
<h1>Retail Sales Dashboard</h1>

<div class="cards">

    <div class="card">
        <h3>Total Sales</h3>
        <p>YOUR TOTAL SALES</p>
    </div>

    <div class="card">
        <h3>Total Quantity</h3>
        <p>YOUR TOTAL QUANTITY</p>
    </div>

</div>

<div class="charts">

    <img src="../assets/sales_by_category.png" alt="Sales by Category">

    <img src="../assets/sales_by_gender.png" alt="Sales by Gender">

    <img src="../assets/sales_over_time.png" alt="Sales Over Time">

</div>
```

</body>
</html>
